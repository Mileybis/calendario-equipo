<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B86FA"/>
      <stop offset="1" stop-color="#2A3DB5"/>
    </linearGradient>
    <radialGradient id="head" cx="38%" cy="28%" r="85%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#E6EBF3"/>
      <stop offset="1" stop-color="#9EA9BF"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4A6C"/>
      <stop offset=".45" stop-color="#1B2335"/>
      <stop offset="1" stop-color="#0C111D"/>
    </linearGradient>
    <radialGradient id="eye" cx="45%" cy="42%" r="60%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".3" stop-color="#B9E4FF"/>
      <stop offset=".65" stop-color="#5A8CFF"/>
      <stop offset="1" stop-color="#3342D6"/>
    </radialGradient>
    <radialGradient id="ear" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#CBD3E3"/>
      <stop offset="1" stop-color="#7E8AA3"/>
    </radialGradient>
    <radialGradient id="tip" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#9EF0FF"/>
      <stop offset="1" stop-color="#2FB8E6"/>
    </radialGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8793AA"/>
      <stop offset=".5" stop-color="#F2F5FA"/>
      <stop offset="1" stop-color="#8793AA"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0A1240" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="64" fill="url(#bg)"/>
  <ellipse cx="128" cy="40" rx="110" ry="40" fill="#FFFFFF" opacity=".08"/>

  <g filter="url(#shadow)">
    <rect x="89" y="30" width="7" height="40" rx="3.5" transform="rotate(-14 92 50)" fill="url(#rod)"/>
    <rect x="160" y="30" width="7" height="40" rx="3.5" transform="rotate(14 163 50)" fill="url(#rod)"/>
    <circle cx="86" cy="30" r="9" fill="url(#tip)" filter="url(#glow)"/>
    <circle cx="170" cy="30" r="9" fill="url(#tip)" filter="url(#glow)"/>

    <ellipse cx="52" cy="134" rx="22" ry="34" fill="url(#ear)"/>
    <ellipse cx="204" cy="134" rx="22" ry="34" fill="url(#ear)"/>
    <ellipse cx="48" cy="134" rx="8" ry="18" fill="#6FA6FF" opacity=".85" filter="url(#glow)"/>
    <ellipse cx="208" cy="134" rx="8" ry="18" fill="#6FA6FF" opacity=".85" filter="url(#glow)"/>

    <rect x="60" y="60" width="136" height="136" rx="46" fill="url(#head)"/>
    <ellipse cx="98" cy="82" rx="34" ry="13" transform="rotate(-18 98 82)" fill="#FFFFFF" opacity=".75"/>

    <rect x="78" y="88" width="100" height="76" rx="32" fill="url(#visor)"/>
    <path d="M92 100 Q128 84 164 100 Q128 93 92 100 Z" fill="#FFFFFF" opacity=".16"/>

    <circle cx="108" cy="122" r="14" fill="url(#eye)" filter="url(#glow)"/>
    <circle cx="148" cy="122" r="14" fill="url(#eye)" filter="url(#glow)"/>
    <circle cx="103" cy="116" r="4" fill="#FFFFFF"/>
    <circle cx="143" cy="116" r="4" fill="#FFFFFF"/>

    <path d="M110 144 Q128 157 146 144" fill="none" stroke="#8FD2FF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <ellipse cx="84" cy="176" rx="10" ry="5" fill="#F7A9C0" opacity=".55"/>
    <ellipse cx="172" cy="176" rx="10" ry="5" fill="#F7A9C0" opacity=".55"/>
  </g>
</svg>
